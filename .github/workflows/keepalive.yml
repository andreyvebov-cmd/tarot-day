name: Keepalive

# GitHub автоматически отключает workflow'ы с триггером schedule в публичных
# репозиториях, если в репозитории 60 дней не было активности. Этот workflow
# раз в 30 дней делает крошечный коммит и сбрасывает счётчик для ВСЕХ
# расписаний, включая "Post to Telegram".

on:
  schedule:
    - cron: '17 3 * * *'   # ежедневная проверка в 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit timestamp if it is older than 30 days
        run: |
          set -euo pipefail
          STAMP=.github/keepalive.txt
          NOW=$(date +%s)
          LAST=$(cat "$STAMP" 2>/dev/null || echo 0)
          [[ "$LAST" =~ ^[0-9]+$ ]] || LAST=0
          AGE_DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Last keepalive: ${AGE_DAYS} day(s) ago"
          if [ "$AGE_DAYS" -lt 30 ]; then
            echo "No commit needed yet."
            exit 0
          fi
          printf '%s\n' "$NOW" > "$STAMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STAMP"
          git commit -m "chore: keepalive (reset 60-day inactivity timer)"
          git push